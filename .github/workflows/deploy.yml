name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Frontend/my-react-app/package-lock.json

      - name: Install Dependencies
        working-directory: Frontend/my-react-app
        run: npm ci

      - name: Build Application for GitHub Pages
        working-directory: Frontend/my-react-app
        env:
          GITHUB_PAGES: 'true'
          VITE_USE_MOCKS: 'true'
        run: npm run build

      - name: Setup SPA 404 Fallback
        working-directory: Frontend/my-react-app/dist
        run: cp index.html 404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Frontend/my-react-app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
